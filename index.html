<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand figure</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee;
         display: flex; flex-direction: column; align-items: center; padding: 16px; }
  button { font-size: 18px; padding: 12px 24px; border: 0; border-radius: 8px;
           background: #4f8cff; color: #fff; cursor: pointer; }
  #wrap { position: relative; width: 100%; max-width: 720px; margin-top: 16px; }
  video, canvas { width: 100%; display: block; transform: scaleX(-1); border-radius: 8px; }
  canvas { position: absolute; top: 0; left: 0; }
  #msg { margin-top: 12px; min-height: 24px; }
</style>
</head>
<body>
  <h1>Hand figure</h1>
  <button id="start">Kamerani yoqish</button>
  <div id="msg"></div>
  <div id="wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>
  </div>

<script type="module">
import { HandLandmarker, FilesetResolver, DrawingUtils }
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("msg");
const startBtn = document.getElementById("start");
let landmarker;

startBtn.onclick = async () => {
  startBtn.disabled = true;
  msg.textContent = "Yuklanmoqda...";
  try {
    const fileset = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await HandLandmarker.createFromOptions(fileset, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },
      runningMode: "VIDEO",
      numHands: 2
    });
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
    video.onloadeddata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      msg.textContent = "Qo'lingni kameraga ko'rsat";
      loop();
    };
  } catch (e) {
    msg.textContent = "Xato: " + e.message;
    startBtn.disabled = false;
  }
};

function loop() {
  const res = landmarker.detectForVideo(video, performance.now());
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const draw = new DrawingUtils(ctx);
  for (const hand of res.landmarks) {
    draw.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS, { color: "#00ff88", lineWidth: 4 });
    draw.drawLandmarks(hand, { color: "#ff3366", radius: 4 });
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
